<!DOCTYPE html>
<html lang="zh-Hant">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>國語詞語練習單</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>

    <!-- 操作工具列 (列印時自動隱藏) -->
    <div class="toolbar no-print">
        <div class="toolbar-status">
            <span class="status-dot" id="status-dot"></span>
            <span id="status-text">載入中...</span>
        </div>
        <div class="toolbar-actions">
            <button type="button" class="btn btn-secondary" id="btn-reload">重新載入</button>
            <button type="button" class="btn" id="btn-print">列印 / 存為 PDF</button>
        </div>
    </div>

    <!-- 動態工作表容器 -->
    <div id="worksheet-container">
        <!-- 內容由 js/app.js 動態載入渲染，注音經由 jQuery 從萌典 (moedict.tw) 非同步取得 -->
    </div>

    <!-- jQuery (優先自 CDN 載入，失敗時回退至本機備用庫) -->
    <script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>
    <script>window.jQuery || document.write('<script src="js/jquery.min.js"><\/script>')</script>

    <!-- 主應用程式邏輯 -->
    <script src="js/app.js"></script>
</body>
</html>
